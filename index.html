<!doctype html>
<html lang="en" class="home-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StatLume</title>
  <meta name="description" content="Realtime YouTube Studio stats on your desktop.">
  <link rel="icon" href="/assets/statlume-logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://get.microsoft.com">
  <link rel="preconnect" href="https://developer.apple.com">
  <link rel="stylesheet" href="/assets/site.css?v=20260927-26">
</head>
<body class="home">
<div class="page">
  <header>
    <a class="brand" href="/"><img src="/assets/statlume-logo.svg" alt="StatLume logo"><span>StatLume</span></a>
    <nav>
      <a href="/" aria-current="page">Home</a>
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
      <a href="/support/">Support</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="hero-copy">
    <h1>Realtime YouTube channel stats on your desktop.</h1>
    <p class="lead">Near-real-time <strong>YouTube Studio</strong> statistics at a glance.</p>

    <div class="store-links" aria-label="Download StatLume">
      <a class="store-card store-card-active" href="https://apps.microsoft.com/" target="_blank" rel="noopener noreferrer">
        <img src="https://get.microsoft.com/images/en-us%20dark.svg" alt="Download from the Microsoft Store">
      </a>
      <button class="store-card store-card-disabled" id="apple-interest" type="button" aria-describedby="apple-interest-status">
        <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
        <span class="store-status" id="apple-interest-status">Coming soon · I’m interested</span>
      </button>
    </div>
      </div>

    <section class="screenshots" aria-label="StatLume screenshots">
      <div class="screenshot-carousel" aria-label="StatLume screenshot gallery">
        <div class="carousel-viewport">
        <div class="carousel-thumbs" role="list" aria-label="Choose a screenshot">
          <button class="screenshot-thumb active" type="button" role="listitem" data-full="/assets/screenshots/release/01.png" data-alt="StatLume screenshot 1" aria-label="Show screenshot 1" aria-current="true"><img src="/assets/screenshots/release-previews/01.webp" alt="" loading="eager" fetchpriority="high" width="1536" height="864"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/02.png" data-alt="StatLume screenshot 2" aria-label="Show screenshot 2"><img src="/assets/screenshots/release-previews/02.webp" alt="" loading="lazy" width="1536" height="864"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/03.png" data-alt="StatLume screenshot 3" aria-label="Show screenshot 3"><img src="/assets/screenshots/release-previews/03.webp" alt="" loading="lazy" width="1536" height="864"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/04.png" data-alt="StatLume screenshot 4" aria-label="Show screenshot 4"><img src="/assets/screenshots/release-previews/04.webp" alt="" loading="lazy" width="1536" height="864"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/05.png" data-alt="StatLume screenshot 5" aria-label="Show screenshot 5"><img src="/assets/screenshots/release-previews/05.webp" alt="" loading="lazy" width="1536" height="864"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/06.png" data-alt="StatLume screenshot 6" aria-label="Show screenshot 6"><img src="/assets/screenshots/release-previews/06.webp" alt="" loading="lazy" width="1536" height="864"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/07.png" data-alt="StatLume screenshot 7" aria-label="Show screenshot 7"><img src="/assets/screenshots/release-previews/07.webp" alt="" loading="lazy" width="1536" height="864"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/07-1.png" data-alt="StatLume screenshot 7.1" aria-label="Show screenshot 7.1"><img src="/assets/screenshots/release-previews/07-1.webp" alt="" loading="lazy" width="1536" height="864"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/08.png" data-alt="StatLume screenshot 8" aria-label="Show screenshot 8"><img src="/assets/screenshots/release-previews/08.webp" alt="" loading="lazy" width="1536" height="864"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/09.png" data-alt="StatLume screenshot 9" aria-label="Show screenshot 9"><img src="/assets/screenshots/release-previews/09.webp" alt="" loading="lazy" width="1536" height="864"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/10.png" data-alt="StatLume screenshot 10" aria-label="Show screenshot 10"><img src="/assets/screenshots/release-previews/10.webp" alt="" loading="lazy" width="1536" height="864"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/11.png" data-alt="StatLume screenshot 11" aria-label="Show screenshot 11"><img src="/assets/screenshots/release-previews/11.webp" alt="" loading="lazy" width="1536" height="864"></button>
        </div>
        </div>
        <div class="carousel-controls">
          <button class="carousel-arrow carousel-prev" type="button" aria-label="Previous screenshot"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15.5 19-7-7 7-7"/></svg></button>
          <div class="carousel-dots" aria-hidden="true"><span class="active"></span><span></span><span></span></div>
          <button class="carousel-arrow carousel-next" type="button" aria-label="Next screenshot"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8.5 5 7 7-7 7"/></svg></button>
        </div>
      </div>
    </section>
    </section>

  </main>
  <footer>StatLume is an independent application and is not affiliated with, endorsed by, sponsored by, or officially connected with Google LLC or YouTube.</footer>
</div>

<div class="lightbox" id="screenshot-lightbox" aria-hidden="true">
  <button class="lightbox-close" type="button" aria-label="Close screenshot">×</button>
  <img src="" alt="">
</div>
<script>
(() => {
  const lightbox = document.getElementById('screenshot-lightbox');
  const image = lightbox.querySelector('img');
  const close = lightbox.querySelector('.lightbox-close');
  const thumbnails = [...document.querySelectorAll('.screenshot-thumb')];
  const carouselViewport = document.querySelector('.carousel-viewport');
  const dots = [...document.querySelectorAll('.carousel-dots span')];
  const previous = document.querySelector('.carousel-prev');
  const next = document.querySelector('.carousel-next');
  const appleInterest = document.getElementById('apple-interest');
  const appleInterestStatus = document.getElementById('apple-interest-status');
  const interestEndpoint = 'https://statlume-github-io.pavelsimonua.workers.dev/interest/apple';
  let previousFocus = null;

  async function recordAppleInterest() {
    if (localStorage.getItem('statlume-apple-interest') === 'recorded') {
      await showAppleInterestCount();
      return;
    }
    appleInterest.disabled = true;
    appleInterestStatus.textContent = 'Recording…';
    try {
      const response = await fetch(interestEndpoint, {method: 'POST'});
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Unable to record interest.');
      localStorage.setItem('statlume-apple-interest', 'recorded');
      appleInterestStatus.textContent = `Thank you · ${result.count} interested`;
    } catch {
      appleInterestStatus.textContent = 'Please try again';
      appleInterest.disabled = false;
    }
  }

  async function showAppleInterestCount() {
    appleInterest.disabled = true;
    appleInterestStatus.textContent = 'Loading interest…';
    try {
      const response = await fetch(interestEndpoint);
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Unable to load interest.');
      appleInterestStatus.textContent = `Thank you · ${result.count} interested`;
    } catch {
      appleInterestStatus.textContent = 'Thank you · Interest recorded';
    }
  }

  function openLightbox(button) {
    previousFocus = button;
    image.src = button.dataset.full;
    image.alt = button.dataset.alt || '';
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lightbox-open');
    close.focus();
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lightbox-open');
    image.src = '';
    if (previousFocus) previousFocus.focus();
  }

  function selectScreenshot(button) {
    thumbnails.forEach(thumbnail => {
      const selected = thumbnail === button;
      thumbnail.classList.toggle('active', selected);
      if (selected) thumbnail.setAttribute('aria-current', 'true');
      else thumbnail.removeAttribute('aria-current');
    });
    const index = thumbnails.indexOf(button);
    const page = Math.min(dots.length - 1, Math.floor(index / Math.ceil(thumbnails.length / dots.length)));
    dots.forEach((dot, dotIndex) => dot.classList.toggle('active', dotIndex === page));
  }

  function moveSelection(direction) {
    const current = Math.max(0, thumbnails.findIndex(thumbnail => thumbnail.classList.contains('active')));
    const target = thumbnails[(current + direction + thumbnails.length) % thumbnails.length];
    selectScreenshot(target);
    centerScreenshot(target);
  }

  function centerScreenshot(target) {
    const left = target.offsetLeft - (carouselViewport.clientWidth - target.offsetWidth) / 2;
    carouselViewport.scrollTo({left, behavior: 'smooth'});
  }

  thumbnails.forEach((button, index) => {
    button.addEventListener('click', () => {
      selectScreenshot(button);
      openLightbox(button);
    });
    button.addEventListener('keydown', event => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      const direction = event.key === 'ArrowRight' ? 1 : -1;
      const next = thumbnails[(index + direction + thumbnails.length) % thumbnails.length];
      selectScreenshot(next);
      next.focus({preventScroll: true});
      centerScreenshot(next);
    });
  });
  previous.addEventListener('click', () => moveSelection(-1));
  next.addEventListener('click', () => moveSelection(1));
  appleInterest.addEventListener('click', recordAppleInterest);
  if (localStorage.getItem('statlume-apple-interest') === 'recorded') {
    showAppleInterestCount();
  }
  close.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', event => {
    if (event.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
  });

  const designWidth = 1600;
  const designHeight = 900;
  let resizeFrame = 0;
  const updateLayoutScale = () => {
    const scale = Math.min(window.innerWidth / designWidth, window.innerHeight / designHeight);
    document.body.style.setProperty('--layout-scale', scale.toFixed(4));
    resizeFrame = 0;
  };
  window.addEventListener('resize', () => {
    if (!resizeFrame) resizeFrame = window.requestAnimationFrame(updateLayoutScale);
  }, {passive: true});
  updateLayoutScale();
})();
</script>
</body>
</html>
