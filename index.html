<body class="home">
<div class="page">

    <section class="hero">

    <div class="store-links" aria-label="Download StatLume">

      </div>

      </div>

    <section class="screenshots" aria-label="StatLume screenshots">

          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/02.png" data-alt="StatLume screenshot 2" aria-label="Show screenshot 2"><img src="/assets/screenshots/release-previews/02.jpg" alt="" loading="lazy" width="768" height="432"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/03.png" data-alt="StatLume screenshot 3" aria-label="Show screenshot 3"><img src="/assets/screenshots/release-previews/03.jpg" alt="" loading="lazy" width="768" height="432"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/04.png" data-alt="StatLume screenshot 4" aria-label="Show screenshot 4"><img src="/assets/screenshots/release-previews/04.jpg" alt="" loading="lazy" width="768" height="432"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/05.png" data-alt="StatLume screenshot 5" aria-label="Show screenshot 5"><img src="/assets/screenshots/release-previews/05.jpg" alt="" loading="lazy" width="768" height="432"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/06.png" data-alt="StatLume screenshot 6" aria-label="Show screenshot 6"><img src="/assets/screenshots/release-previews/06.jpg" alt="" loading="lazy" width="768" height="432"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/07.png" data-alt="StatLume screenshot 7" aria-label="Show screenshot 7"><img src="/assets/screenshots/release-previews/07.jpg" alt="" loading="lazy" width="768" height="432"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/07-1.png" data-alt="StatLume screenshot 7.1" aria-label="Show screenshot 7.1"><img src="/assets/screenshots/release-previews/07-1.jpg" alt="" loading="lazy" width="768" height="432"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/08.png" data-alt="StatLume screenshot 8" aria-label="Show screenshot 8"><img src="/assets/screenshots/release-previews/08.jpg" alt="" loading="lazy" width="768" height="432"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/09.png" data-alt="StatLume screenshot 9" aria-label="Show screenshot 9"><img src="/assets/screenshots/release-previews/09.jpg" alt="" loading="lazy" width="768" height="432"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/10.png" data-alt="StatLume screenshot 10" aria-label="Show screenshot 10"><img src="/assets/screenshots/release-previews/10.jpg" alt="" loading="lazy" width="768" height="432"></button>
          <button class="screenshot-thumb" type="button" role="listitem" data-full="/assets/screenshots/release/11.png" data-alt="StatLume screenshot 11" aria-label="Show screenshot 11"><img src="/assets/screenshots/release-previews/11.jpg" alt="" loading="lazy" width="768" height="432"></button>

        <div class="carousel-controls">
          <button class="carousel-arrow carousel-prev" type="button" aria-label="Previous screenshot"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15.5 19-7-7 7-7"/></svg></button>

</div>

<div class="lightbox" id="screenshot-lightbox" aria-hidden="true">
  <button class="lightbox-close" type="button" aria-label="Close screenshot">×</button>
  <img src="" alt="">
</div>
<script>
(() => {
  const lightbox = document.getElementById('screenshot-lightbox');
  const image = lightbox.querySelector('img');
  const close = lightbox.querySelector('.lightbox-close');
  const thumbnails = [...document.querySelectorAll('.screenshot-thumb')];
  const dots = [...document.querySelectorAll('.carousel-dots span')];
  const previous = document.querySelector('.carousel-prev');
  const next = document.querySelector('.carousel-next');
  let previousFocus = null;

  function openLightbox(button) {
    previousFocus = button;
    image.src = button.dataset.full;
    image.alt = button.dataset.alt || '';
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.classList.add('lightbox-open');
    close.focus();
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('lightbox-open');
    image.src = '';
    if (previousFocus) previousFocus.focus();
  }

  function selectScreenshot(button) {
    thumbnails.forEach(thumbnail => {
      const selected = thumbnail === button;
      thumbnail.classList.toggle('active', selected);
      if (selected) thumbnail.setAttribute('aria-current', 'true');
      else thumbnail.removeAttribute('aria-current');
    });
    const index = thumbnails.indexOf(button);
    const page = Math.min(dots.length - 1, Math.floor(index / Math.ceil(thumbnails.length / dots.length)));
    dots.forEach((dot, dotIndex) => dot.classList.toggle('active', dotIndex === page));
  }

  function moveSelection(direction) {
    const current = Math.max(0, thumbnails.findIndex(thumbnail => thumbnail.classList.contains('active')));
    const target = thumbnails[(current + direction + thumbnails.length) % thumbnails.length];
    selectScreenshot(target);
    target.scrollIntoView({behavior: 'smooth', block: 'nearest', inline: 'center'});
  }

  thumbnails.forEach((button, index) => {
    button.addEventListener('click', () => {
      selectScreenshot(button);
      openLightbox(button);
    });
    button.addEventListener('keydown', event => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      const direction = event.key === 'ArrowRight' ? 1 : -1;
      const next = thumbnails[(index + direction + thumbnails.length) % thumbnails.length];
      selectScreenshot(next);
      next.focus();
    });
  });
  previous.addEventListener('click', () => moveSelection(-1));
  next.addEventListener('click', () => moveSelection(1));
  close.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', event => {
    if (event.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
  });

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let parallaxFrame = 0;
    const updateParallax = () => {
      const shift = Math.max(-80, window.scrollY * -.12);
      document.body.style.setProperty('--space-shift', `${shift}px`);
      parallaxFrame = 0;
    };
    window.addEventListener('scroll', () => {
      if (!parallaxFrame) parallaxFrame = window.requestAnimationFrame(updateParallax);
    }, {passive: true});
    updateParallax();
  }

  const designWidth = 1600;
  const designHeight = 920;
  let resizeFrame = 0;
  const updateLayoutScale = () => {
    const scale = window.innerWidth / designWidth;
    document.body.style.setProperty('--layout-scale', scale.toFixed(4));
    document.body.style.minHeight = `${Math.ceil(designHeight * scale)}px`;
    resizeFrame = 0;
  };
  window.addEventListener('resize', () => {
    if (!resizeFrame) resizeFrame = window.requestAnimationFrame(updateLayoutScale);
  }, {passive: true});
  updateLayoutScale();
})();
</script>
</body>
</html>
